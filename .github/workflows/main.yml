# test
name: selenium

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  schedule:
    - cron: '0 23 * * *'
  # Allows you to run this workflow manually from the Actions tab
#  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v5

      # Runs a single command using the runners shell
      - name: 'Set up Python'
        uses: actions/setup-python@v6
        with:
           python-version: 3.7
      - name: 'Install requirements'
        run: |
          pip install --upgrade pip
          pip install -r ./requirements.txt
        
      - name: Prepare chromedriver
        uses: nanasess/setup-chromedriver@v2
        
      - name: 'Working'
        run: |
          # sudo cp -p ./chromedriver /usr/bin/
          # chmod -R 777 /usr/bin/chromedriver
          # python ./gamekegs.py ${{ secrets.GAMEKEGS_USERNAME }} ${{ secrets.GAMEKEGS_PASSWORD }}
          python ./freedoor.py ${{ secrets.FREEDOOR_USERNAME }} ${{ secrets.FREEDOOR_PASSWORD }}

      - name: Upload Error Screenshot
        if: failure() # 只有在 Working 失败时才运行
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
